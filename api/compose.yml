
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-invitaciones
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - nginx_net
      - database_net

networks:
  nginx_net:
    name: nginx_default
    external: true

  database_net:
    name: nextcloud_default
    external: true

